<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Alke Wallet</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="/styles/login.css" />
  </head>
  <body>
    <div class="card login-container">
      <header class="header-login">
        <img
          src="/assets/logo.svg"
          alt="Alke Wallet"
          class="logo"
          width="150"
          height="150"
        />
        <h2>Iniciar sesión</h2>
        <p class="description">
          Bienvenido a tu banco ecológico Alke Wallet, ingresa tu email y
          contraseña para acceder a tu cuenta
        </p>
      </header>

      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input
            type="email"
            id="email"
            class="form-control"
            name="email"
            placeholder="Ingresa tu email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input
            type="password"
            id="password"
            class="form-control"
            name="password"
            placeholder="Ingresa tu contraseña"
            required
          />
        </div>

        <div class="actions-group mt-5">
          <button id="login-btn" type="submit" class="btn btn-primary">
            Login
          </button>
          <a href="#" class="forgot-password">Olvide mi contraseña</a>
        </div>
      </form>
    </div>

    <script src="/js/index.js"></script>
  </body>
</html>
