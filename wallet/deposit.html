<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depositar - Alke Wallet</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="/styles/deposit.css" />
  </head>
  <body>
    <div class="card deposit-container">
      <header class="header-deposit">
        <img
          src="/assets/logo.svg"
          alt="Alke Wallet"
          class="logo"
          width="80"
          height="80"
        />
        <h2>Depositar</h2>
        <p class="description">
          Ingresa el monto que deseas depositar y realiza tu depósito.
        </p>
      </header>

      <form id="deposit-form">
        <div class="mb-3">
          <label for="amount" class="form-label">Monto a depositar:</label>
          <input
            type="number"
            id="amount"
            class="form-control"
            name="amount"
            placeholder="Ingresa el monto"
            required
          />
        </div>
      </form>

      <div class="actions-group mt-5">
        <button type="submit" form="deposit-form" class="btn btn-primary">
          Realizar depósito
        </button>
        <a href="/dashboard/menu.html" class="btn btn-secondary">
          Volver al menú principal
        </a>
      </div>
    </div>

    <script src="/js/index.js"></script>
  </body>
</html>
