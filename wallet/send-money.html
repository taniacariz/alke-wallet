<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enviar dinero - Alke Wallet</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="/styles/send-money.css" />
  </head>
  <body>
    <div class="send-container">
      <h2>Enviar dinero</h2>

      <form id="send-money-form">
        <div class="amount-container">
          <label for="send-amount" class="form-label">Monto a enviar:</label>
          <input
            type="number"
            class="form-control"
            id="send-amount"
            name="send-amount"
            placeholder="Ej: 15000"
            required
          />
        </div>

        <div class="contact-container">
          <h2>Contactos</h2>

          <button
            type="button"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#addContactModal"
          >
            Agregar nuevo contacto
          </button>

          <table class="table table-hover contact-table">
            <thead>
              <tr>
                <th scope="col"></th>
                <th scope="col">Nombre</th>
                <th scope="col">Email</th>
                <th scope="col">Banco</th>
                <th scope="col">Cuenta</th>
                <th scope="col">Alias</th>
              </tr>
            </thead>
            <tbody id="contact-list">
              <tr data-name="Vicente Ramos">
                <td><input type="radio" name="selected-contact" /></td>
                <td>Vicente Ramos</td>
                <td>vicente@ejemplo.com</td>
                <td>Banco Estado</td>
                <td>123456789</td>
                <td>Vicentenario</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Realizar envío</button>

          <a href="/dashboard/menu.html" class="btn btn-primary">
            Volver al menú principal
          </a>
        </div>
      </form>
    </div>

    <div
      class="modal fade"
      id="addContactModal"
      tabindex="-1"
      aria-labelledby="addContactModalLabel"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addContactModalLabel">
              Nuevo Contacto
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="add-contact-form">
              <div>
                <label for="contact-name">Nombre y apellido:</label>
                <input type="text" id="contact-name" required />
              </div>
              <div>
                <label for="contact-email">Email:</label>
                <input type="email" id="contact-email" required />
              </div>

              <div>
                <label for="contact-bank">Banco:</label>
                <input type="text" id="contact-bank" required />
              </div>
              <div>
                <label for="contact-account">Cuenta:</label>
                <input type="text" id="contact-account" required />
              </div>

              <div>
                <label for="contact-alias">Alias:</label>
                <input type="text" id="contact-alias" required />
              </div>

              <div>
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancelar
                </button>
                <button type="submit" class="btn btn-primary">
                  Guardar contacto
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/index.js"></script>
  </body>
</html>
