<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enviar dinero - Alke Wallet</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="/styles/send-money.css" />
  </head>
  <body>
    <div class="card send-money-container">
      <header class="header-send-money">
        <img
          src="/assets/logo.svg"
          alt="Alke Wallet"
          class="logo"
          width="80"
          height="80"
        />
        <h2>Enviar dinero</h2>
        <p class="description">
          Ingresa el monto, selecciona un contacto y realiza tu envío.
        </p>
      </header>

      <form id="send-money-form">
        <div class="contact-container">
          <h3>Contactos</h3>

          <table class="table table-hover contact-table">
            <thead>
              <tr>
                <th scope="col"></th>
                <th scope="col">Nombre</th>
                <th scope="col">Banco</th>
                <th scope="col">Cuenta</th>
                <th scope="col">Alias</th>
              </tr>
            </thead>
            <tbody id="contact-list">
              <tr data-name="Vicente Ramos">
                <td><input type="radio" name="selected-contact" /></td>
                <td>Vicente Ramos</td>
                <td>Banco Estado</td>
                <td>123456789</td>
                <td>Vicentenario</td>
              </tr>
            </tbody>
          </table>

          <div class="contact-actions">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#addContactModal"
            >
              Agregar nuevo contacto
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label for="send-amount" class="form-label">Monto a enviar:</label>
          <input
            type="number"
            id="send-amount"
            class="form-control"
            name="send-amount"
            placeholder="Ej: 15000"
            required
          />
        </div>

        <div class="actions-group mt-5">
          <button type="submit" class="btn btn-primary">Realizar envío</button>
          <a href="/dashboard/menu.html" class="btn btn-secondary">
            Volver al menú principal
          </a>
        </div>
      </form>
    </div>

    <div
      class="modal fade"
      id="addContactModal"
      tabindex="-1"
      aria-labelledby="addContactModalLabel"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addContactModalLabel">
              Nuevo Contacto
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="add-contact-form">
              <div class="mb-3">
                <label for="contact-name" class="form-label">
                  Nombre y apellido:
                </label>
                <input
                  type="text"
                  id="contact-name"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="contact-bank" class="form-label">Banco:</label>
                <input
                  type="text"
                  id="contact-bank"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="contact-account" class="form-label">Cuenta:</label>
                <input
                  type="text"
                  id="contact-account"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="contact-alias" class="form-label">Alias:</label>
                <input
                  type="text"
                  id="contact-alias"
                  class="form-control"
                  required
                />
              </div>

              <div class="actions-group mt-5">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancelar
                </button>
                <button type="submit" class="btn btn-primary">
                  Guardar contacto
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/index.js"></script>
  </body>
</html>
