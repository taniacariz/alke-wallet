<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu - Alke Wallet</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="/styles/menu.css" />
  </head>
  <body>
    <div class="menu-container">
      <h2>Menú Principal</h2>

      <div class="balance-container mb-4">
        <span class="balance-title">Dinero en cuenta:</span>
        <h3 class="balance-amount">$<span id="balance-amount">100000</span></h3>
      </div>

      <div class="button-group">
        <a href="/wallet/deposit.html" class="btn btn-primary"> 
          Depositar dinero
        </a>
        <a href="/wallet/send-money.html" class="btn btn-primary">
          Enviar dinero
        </a>
        <a href="/wallet/transactions.html" class="btn btn-primary">
          Últimos movimientos
        </a>
      </div>
    </div>

    <script>
      const balanceAmount = document.getElementById("balance-amount");

      if (!localStorage.getItem("balance")) {
        localStorage.setItem("balance", balanceAmount.textContent);
      }

      balanceAmount.textContent = localStorage.getItem("balance");
    </script>
    <script src="/js/index.js"></script>
  </body>
</html>
